<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 56" width="680" height="56" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><title>bye-bye!</title><desc>Closing terminal line: exit, bye-bye!</desc><g transform="translate(0,0)"><rect width="680" height="56" rx="8" fill="#1e1e2e"/><text x="24" y="34" font-size="13" fill="#cdd6f4"><tspan fill="#a6e3a1">$</tspan> exit <tspan fill="#6c7086"># bye-bye!</tspan></text><rect x="162.6" y="22" width="9" height="16" fill="#cba6f7"><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect></g></svg>