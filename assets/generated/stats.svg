<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 132" width="680" height="132" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><title>GitHub stats</title><desc>Repositories, stars, followers, commits and pull requests.</desc><defs></defs><rect x=".5" y=".5" width="679" height="131" rx="10" fill="#1e1e2e" stroke="#313244"/><g opacity="0"><rect x="24" y="28" width="116" height="76" rx="8" fill="#181825" stroke="#313244"/><text x="82.0" y="66" text-anchor="middle" font-size="24" font-weight="500" fill="#cba6f7">46</text><text x="82.0" y="87" text-anchor="middle" font-size="12" fill="#a6adc8">repos</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.20s" fill="freeze"/></g><g opacity="0"><rect x="153" y="28" width="116" height="76" rx="8" fill="#181825" stroke="#313244"/><text x="211.0" y="66" text-anchor="middle" font-size="24" font-weight="500" fill="#f9e2af">58</text><text x="211.0" y="87" text-anchor="middle" font-size="12" fill="#a6adc8">stars</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.32s" fill="freeze"/></g><g opacity="0"><rect x="282" y="28" width="116" height="76" rx="8" fill="#181825" stroke="#313244"/><text x="340.0" y="66" text-anchor="middle" font-size="24" font-weight="500" fill="#89b4fa">12</text><text x="340.0" y="87" text-anchor="middle" font-size="12" fill="#a6adc8">followers</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.44s" fill="freeze"/></g><g opacity="0"><rect x="411" y="28" width="116" height="76" rx="8" fill="#181825" stroke="#313244"/><text x="469.0" y="66" text-anchor="middle" font-size="24" font-weight="500" fill="#fab387">6,808</text><text x="469.0" y="87" text-anchor="middle" font-size="12" fill="#a6adc8">commits</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.56s" fill="freeze"/></g><g opacity="0"><rect x="540" y="28" width="116" height="76" rx="8" fill="#181825" stroke="#313244"/><text x="598.0" y="66" text-anchor="middle" font-size="24" font-weight="500" fill="#a6e3a1">112</text><text x="598.0" y="87" text-anchor="middle" font-size="12" fill="#a6adc8">pull requests</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.68s" fill="freeze"/></g></svg>