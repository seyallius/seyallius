<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" width="680" height="244" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><title>Productivity insights</title><desc>Commit rhythm by time of day and repositories by language.</desc><defs></defs><rect x=".5" y=".5" width="679" height="243" rx="10" fill="#1e1e2e" stroke="#313244"/><text x="32" y="44" font-size="11" font-weight="500" fill="#6c7086">WHEN I COMMIT</text><text x="372" y="44" font-size="11" font-weight="500" fill="#6c7086">WHAT I BUILD IN</text><rect x="338" y="28" width="1" height="184" fill="#313244"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.20s" fill="freeze"/><text x="32" y="76" font-size="12" fill="#a6adc8">morning</text><rect x="110" y="65" width="128" height="12" rx="3" fill="#313244"/><rect x="110" y="65" width="0" height="12" rx="3" fill="#f9e2af"><animate attributeName="width" from="0" to="116" dur="1.2s" begin="0.40s" fill="freeze"/></rect><text x="248" y="76" font-size="12" fill="#cdd6f4">34.9%</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.30s" fill="freeze"/><text x="32" y="108" font-size="12" fill="#a6adc8">daytime</text><rect x="110" y="97" width="128" height="12" rx="3" fill="#313244"/><rect x="110" y="97" width="0" height="12" rx="3" fill="#fab387"><animate attributeName="width" from="0" to="43" dur="1.2s" begin="0.52s" fill="freeze"/></rect><text x="248" y="108" font-size="12" fill="#cdd6f4">12.9%</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.40s" fill="freeze"/><text x="32" y="140" font-size="12" fill="#a6adc8">evening</text><rect x="110" y="129" width="128" height="12" rx="3" fill="#313244"/><rect x="110" y="129" width="0" height="12" rx="3" fill="#cba6f7"><animate attributeName="width" from="0" to="44" dur="1.2s" begin="0.64s" fill="freeze"/></rect><text x="248" y="140" font-size="12" fill="#