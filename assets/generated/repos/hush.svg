<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 124" width="336" height="124" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><title>hush</title><desc>Total silence for your videos. Encrypts the title, thumbnail, audio, and pixels into an unplayable blob. Stream-decrypt on the fly with Rust.</desc><rect x=".5" y=".5" width="335" height="123" rx="10" fill="#1e1e2e" stroke="#313244"/><rect x="1" y="1" width="4" height="122" rx="2" fill="#fab387" opacity=".8"/><text x="20" y="34" font-size="15" font-weight="600" fill="#cba6f7"><tspan fill="#6c7086" font-weight="400">~/</tspan>hush</text><text x="316" y="33" font-size="14" text-anchor="end" fill="#6c7086" xml:space="preserve">↗</text><text x="20" y="62" font-size="12" fill="#a6adc8" xml:space="preserve">Total silence for your videos. Encrypts</text><text x="20" y="81" font-size="12" fill="#a6adc8" xml:space="preserve">the title, thumbnail, audio, and pixels…</text><circle cx="25" cy="100" r="5" fill="#fab387"/><text x="36" y="104" font-size="12" fill="#cdd6f4" xml:space="preserve">rust</text><text x="82.8" y="104" font-size="12" fill="#f9e2af" xml:space="preserve">★ 2</text></svg>