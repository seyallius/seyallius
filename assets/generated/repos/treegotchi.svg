<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 222 228" width="222" height="228" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><title>treegotchi</title><desc>Feed it a tree structure, watch it grow. A lightweight app that instantly converts textual folder trees into real directory structures on disk.</desc><defs><clipPath id="c"><rect width="222" height="228" rx="10"/></clipPath></defs><g clip-path="url(#c)"><rect width="222" height="228" fill="#1e1e2e"/><rect width="222" height="3" fill="#fab387"/></g><rect x=".5" y=".5" width="221" height="227" rx="10" fill="none" stroke="#313244"/><text x="18" y="32" font-size="14" font-weight="600" fill="#cba6f7"><tspan fill="#6c7086" font-weight="400">~/</tspan>treegotchi</text><text x="18" y="58" font-size="12" fill="#a6adc8" xml:space="preserve">Feed it a tree structure,</text><text x="18" y="76" font-size="12" fill="#a6adc8" xml:space="preserve">watch it grow. A</text><text x="18" y="94" font-size="12" fill="#a6adc8" xml:space="preserve">lightweight app that</text><text x="18" y="112" font-size="12" fill="#a6adc8" xml:space="preserve">instantly converts</text><text x="18" y="130" font-size="12" fill="#a6adc8" xml:space="preserve">textual folder trees into</text><text x="18" y="148" font-size="12" fill="#a6adc8" xml:space="preserve">real directory structures</text><text x="18" y="166" font-size="12" fill="#a6adc8" xml:space="preserve">on disk.</text><rect x="18" y="188" width="186" height="1" fill="#313244"/><circle cx="22" cy="205" r="4.5" fill="#fab387"/><text x="32" y="209" font-size="12" fill="#cdd6f4" xml:space="preserve">rust</text><text x="74.8" y="209" font-size="12" fill="#f9e2af" xml:space="preserve">★ 0</text><text x="204" y="209" font-size="11" text-anchor="end" fill="#6c7086" xml:space="preserve">open ↗</text></svg>