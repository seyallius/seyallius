<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><title>about.md</title><desc>About: role: Go backend engineer. Scalable systems that don&#x27;t fall over. obsessed: Rust: systems, CLI tools, memory safety and speed. origin: 3+ years of Java and Spring Boot microservices. creed: Simplicity, concurrency and performance are not trade-offs. routine: 4 AM to 7 AM is project time. Most days.</desc><g transform="translate(0,0)"><rect width="680" height="190" rx="8" fill="#1e1e2e"/><rect width="680" height="28" rx="8" fill="#181825"/><rect y="14" width="680" height="14" fill="#181825"/><circle cx="18" cy="14" r="5" fill="#f38ba8"/><circle cx="36" cy="14" r="5" fill="#f9e2af"/><circle cx="54" cy="14" r="5" fill="#a6e3a1"/><text x="340" y="18" text-anchor="middle" font-size="12" fill="#6c7086">about.md</text><text x="24" y="58" font-size="13" fill="#cdd6f4"><tspan fill="#a6e3a1">$</tspan> cat about.md</text><g opacity="0"><text x="24" y="88" font-size="13" fill="#89b4fa">role</text><text x="110" y="88" font-size="13" fill="#cdd6f4">Go backend engineer. Scalable systems that don&#x27;t fall over.</text><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/></g><g opacity="0"><text x="24" y="110" font-size="13" fill="#89b4fa">obsessed</text><text x="110" y="110" font-size="13" fill="#cdd6f4">Rust: systems, CLI tools, memory safety and speed.</text><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze"/></g><g opacity="0"><text x="24" y="132" font-size="13" fill="#89b4fa">origin</text><text x="110" y="132" font-size="13" fill="#cdd6f4">3+ years of Java and Spring Boot microservices.</text><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/></g><g opacity="0"><text x="24" y="154" font-size="13" fill="#89b4fa">creed</text><text x="110" y="154" font-size="13" fill="#cdd6f4">Simplicity, concurrency and performance are not trade-offs.</text><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze"/></g><g opacity="0"><text x="24" y="176" font-size="13" fill="#89b4fa">routine</text><text x="110" y="176" font-size="13" fill="#cdd6f4">4 AM to 7 AM is project time. Most days.</text><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/></g></g></svg>